[package]
name = "capcore"
version = "2.1.1"
edition = "2021"
description = "Capacitor network synthesis engine (series-parallel DP, Laplacian evaluation)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
